name: Throne build matrix
on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (leave 'auto' to auto-increment version)"
        required: false
        default: "auto"
      publish:
        description: "r for normal release, p for prerelease, defaults to r"
        required: false
        default: "r"
jobs:
  resolve-version:
    name: Resolve & Increment Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version_step.outputs.tag }}
      version: ${{ steps.version_step.outputs.version }}
      previous_tag: ${{ steps.version_step.outputs.previous_tag }}
      publish: ${{ steps.version_step.outputs.publish }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate Next Version Tag
        id: version_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          PUBLISH="${{ github.event.inputs.publish }}"
          [ -z "$PUBLISH" ] && PUBLISH="r"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          chmod +x ./script/get_next_version.cjs || true
          node ./script/get_next_version.cjs "${{ github.ref_name }}" "${{ github.event.inputs.tag }}" "${{ github.repository }}"

  build-go:
    name: Build Go (${{ matrix.cross_os }}-${{ matrix.cross_arch }})
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.27.0"
            runner: ubuntu-22.04
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        run: |
          # MetaCubeX/go restores Win7 / macOS 10.15 support; stay on 1.26 since Go 1.27 drops macOS < 13
          mkdir -p golang.org
          curl -fL "https://github.com/MetaCubeX/go/releases/download/build/go1.26.$(go env GOHOSTOS)-$(go env GOHOSTARCH).tar.gz" | tar -xz -C golang.org
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x ./script/build_go.sh || true
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} bash ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0

  build-cpp:
    name: Build C++ (${{ matrix.dest_suffix }})
    permissions:
      contents: read
    needs:
      - build-go
      - resolve-version
    strategy:
      matrix:
        include:
          - platform: windows-latest
            qt_version: "6.11.2"
            target: x64
            dest_suffix: windows-amd64
            common: windows-amd64
            launcher: sccache
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      INPUT_VERSION: ${{ needs.resolve-version.outputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          # Read-only pack files make this flaky on Windows; cmake filters .git out anyway.
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          # cmake globs res/dashboard at configure time and silently ships nothing if it
          # is empty, so fail here instead of releasing a build without the dashboard.
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        if: contains( matrix.platform, 'windows' )
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target }}
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        if: contains( matrix.platform, 'windows' )
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: contains( matrix.platform, 'windows' ) && steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'windows' )
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          chmod +x ./script/deploy_windows.sh || true
          bash ./script/deploy_windows.sh
      - name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0

  pack:
    name: Pack ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-cpp
      - resolve-version
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: windows
            runner: windows-latest
            artifacts: "windows*"
      fail-fast: false
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Throne-${{ github.sha }}-${{ matrix.artifacts }}
          path: download-artifact
      - name: Pack
        shell: bash
        run: bash ./script/pack_release.sh ${{ matrix.target }} "${{ needs.resolve-version.outputs.tag }}"
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pack-${{ github.sha }}-${{ matrix.target }}
          path: deployment/Throne-*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - pack
      - resolve-version
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-*
          merge-multiple: true
          path: deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
          compression-level: 0
      - name: Installing ghr
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
      - name: PreRelease
        if: needs.resolve-version.outputs.publish == 'p'
        run: |
          TAG_NAME="${{ needs.resolve-version.outputs.tag }}"
          ./ghr -prerelease -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "$TAG_NAME" "$TAG_NAME" deployment
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" ${{ github.sha }}
          git push origin "$TAG_NAME" --force || true
      - name: Release
        if: needs.resolve-version.outputs.publish != 'p' && needs.resolve-version.outputs.publish != 'none' && needs.resolve-version.outputs.publish != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ needs.resolve-version.outputs.tag }}"
          echo "Publishing release $TAG_NAME to GitHub Releases..."
          if ./ghr -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "$TAG_NAME" "$TAG_NAME" deployment; then
            echo "Successfully published via ghr."
          else
            echo "Falling back to GitHub CLI gh release..."
            gh release create "$TAG_NAME" deployment/* --title "$TAG_NAME" --notes "Automated release build for Throne ($TAG_NAME)" --target ${{ github.sha }} --clobber
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" ${{ github.sha }}
          git push origin "$TAG_NAME" --force || true

  # Updates the AUR package after a stable release.
  publish-aur:
    name: Publish AUR Package
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.repository == 'throneproj/Throne' && github.event.inputs.publish == 'r'
    permissions:
      contents: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Validate version and update PKGBUILD
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._+]+$ ]]; then
            echo "::error::Cannot publish '$VERSION' to AUR: not a valid pkgver. AUR is only updated for stable releases (publish=r)."
            exit 1
          fi
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/;s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: throne
          asset_dir: aur
          updpkgsums: true
          commit_username: throneproj-bot
          commit_email: throneproj-bot@users.noreply.github.com
          commit_message: Update to ${{ github.event.inputs.tag }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
  # Publishes the RPM and APT repositories to this repository's GitHub Pages,
  # served at https://throneproj.github.io/Throne/rpm/ and
  # https://throneproj.github.io/Throne/apt/.
  publish-repos:
    name: Publish RPM and APT Repositories
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.repository == 'throneproj/Throne' && github.event.inputs.publish == 'r'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Must match the key in the REPO_SIGNING_KEY secret of the github-pages environment.
      SIGNING_FPR: 5EEB21A857E9C485DBA5F4E000316AB4369049D6
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-linux-*
          merge-multiple: true
          path: deployment
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y createrepo-c dpkg-dev apt-utils rpm
      - name: Import signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_FPR" > /dev/null
          mkdir -p repo
          gpg --batch --armor --export "$SIGNING_FPR" > repo/throne.asc
      - name: Build RPM repository
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          AMD64="deployment/Throne-${VERSION}-fedora-amd64-system-qt.rpm"
          ARM64="deployment/Throne-${VERSION}-fedora-arm64-system-qt.rpm"
          test -f "$AMD64" && test -f "$ARM64"
          mkdir -p repo/rpm
          cp "$AMD64" "$ARM64" repo/rpm/
          # Signing rewrites the files, so it must run before createrepo_c checksums them.
          rpmsign --addsign --define "_gpg_name $SIGNING_FPR" repo/rpm/*.rpm
          createrepo_c repo/rpm
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign repo/rpm/repodata/repomd.xml
          printf '%s\n' '[throne]' 'name=Throne RPM repository' \
            'baseurl=https://throneproj.github.io/Throne/rpm' \
            'enabled=1' 'autorefresh=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
            'gpgkey=https://throneproj.github.io/Throne/throne.asc' > repo/rpm/throne.repo
      - name: Build APT repository
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          AMD64="deployment/Throne-${VERSION}-debian-amd64-system-qt.deb"
          ARM64="deployment/Throne-${VERSION}-debian-arm64-system-qt.deb"
          test -f "$AMD64" && test -f "$ARM64"
          mkdir -p repo/apt/pool/main \
            repo/apt/dists/stable/main/binary-amd64 \
            repo/apt/dists/stable/main/binary-arm64
          # dpkg-scanpackages --arch only picks up files named *_<arch>.deb.
          cp "$AMD64" "repo/apt/pool/main/throne_${VERSION}_amd64.deb"
          cp "$ARM64" "repo/apt/pool/main/throne_${VERSION}_arm64.deb"
          cd repo/apt
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool /dev/null > "dists/stable/main/binary-${arch}/Packages"
            gzip -k9 "dists/stable/main/binary-${arch}/Packages"
          done
          # Staged outside dists/stable, which apt-ftparchive scans, so Release does not list itself.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=throne \
            -o APT::FTPArchive::Release::Label=Throne \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o 'APT::FTPArchive::Release::Architectures=amd64 arm64' \
            -o APT::FTPArchive::Release::Components=main \
            -o 'APT::FTPArchive::Release::Description=Throne APT repository' \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_FPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/throne.asc] https://throneproj.github.io/Throne/apt stable main' > throne.list
          # deb822 multi-line field: every line indented, blank lines written as " .".
          { printf '%s\n' 'Types: deb' \
              'URIs: https://throneproj.github.io/Throne/apt' \
              'Suites: stable' 'Components: main' 'Signed-By:'
            sed 's/^$/./; s/^/ /' ../throne.asc; } > throne.sources
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
